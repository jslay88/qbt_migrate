[build-system]
requires = ["flit_core>=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "qbt_migrate"
authors = [
    {name = "Justin Slay", email = "justin.slay@gmail.com"},
]
dependencies = [
    "bencode.py>=4.0,<5",
]
requires-python = ">=3.10"
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: File Sharing",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Recovery Tools",
    "Typing :: Typed",
]
dynamic = [
    "version",
    "description",
]

[project.optional-dependencies]
dev = [
    "bandit",
    "coverage",
    "diff-cover",
    "pre-commit",
    "pytest>=2.7.3",
    "ruff",
]
test = [
    "tox",
]

[project.urls]
Source = "https://github.com/jslay88/qbt_migrate"

[project.scripts]
qbt_migrate = "qbt_migrate.cli:main"

[tool.bandit]
exclude_dirs = [
    "tests",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = [
    "tests",
]
addopts = "--strict-markers --strict-config -ra"
filterwarnings = [
    "error",
]

[tool.coverage.run]
branch = true
source = [
    "qbt_migrate",
]

[tool.coverage.report]
show_missing = true
# Currently 99%. The one open partial branch is the `continue` in
# `discover_relevant_fast_resume`, which depends on `iterdir()` ordering and so
# can flip between runs. Kept a point below to avoid flaky failures, ratchet up
# once iteration order is deterministic. diff-cover still enforces 100% on
# changed lines.
fail_under = 98
exclude_also = [
    "if TYPE_CHECKING:",
]

[tool.ruff]
exclude = [
    ".tox",
    "venv",
]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "C90", # mccabe complexity
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
# F401: re-exports for the public API surface.
# E501: the module docstring is the package summary in built metadata, so it
#       has to stay on one line.
"qbt_migrate/__init__.py" = ["E501", "F401"]

[tool.ruff.lint.isort]
lines-after-imports = 2

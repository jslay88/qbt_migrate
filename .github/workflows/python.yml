name: Python QA Checks
# Python checks (usually tox matrix) to ensure code quality for PRs and merging
# Runs on pull requests and on pushes to master

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Version used for jobs that are not part of the support matrix.
  DEFAULT_PYTHON: "3.14"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - '**.py'
              - 'tox.ini'
              - 'pyproject.toml'

      - name: Setup Python
        uses: actions/setup-python@v7
        if: steps.filter.outputs.python == 'true'
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Install Dependencies
        if: steps.filter.outputs.python == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Run Tox Linting
        if: steps.filter.outputs.python == 'true'
        run: tox -e lint

  unittest:
    # Named explicitly so the check name stays `Unit Tests (py310-unittest)`.
    # Left implicit, GitHub derives it from the whole matrix entry, which makes
    # it `Unit Tests (py310-unittest, 3.10)` and silently breaks the required
    # status check contexts on master any time the matrix keys change.
    name: Unit Tests (${{ matrix.toxenv }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - toxenv: py310-unittest
            python-version: "3.10"
          - toxenv: py311-unittest
            python-version: "3.11"
          - toxenv: py312-unittest
            python-version: "3.12"
          - toxenv: py313-unittest
            python-version: "3.13"
          - toxenv: py314-unittest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - '**.py'
              - 'tox.ini'
              - 'pyproject.toml'

      - name: Set up Python
        uses: actions/setup-python@v7
        if: steps.filter.outputs.python == 'true'
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install Tox
        if: steps.filter.outputs.python == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Run Tox
        if: steps.filter.outputs.python == 'true'
        run: |
          tox -e ${{ matrix.toxenv }}

      - name: Dump Test Coverage
        if: steps.filter.outputs.python == 'true' && matrix.python-version == '3.14'
        run: |
          pip install coverage
          coverage xml

      - name: Store Test Coverage
        if: steps.filter.outputs.python == 'true' && matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            ./.coverage
            ./coverage.xml
          include-hidden-files: true

  coverage:
    runs-on: ubuntu-latest
    name: Coverage
    needs:
      - unittest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - '**.py'
              - 'tox.ini'
              - 'pyproject.toml'

      - name: Setup Python
        uses: actions/setup-python@v7
        if: steps.filter.outputs.python == 'true'
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Install Coverage & diff_cover
        if: steps.filter.outputs.python == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install coverage diff_cover

      - name: Retrieve Coverage Results
        if: steps.filter.outputs.python == 'true'
        uses: actions/download-artifact@v8
        with:
          name: coverage

      - name: Overall Coverage
        if: steps.filter.outputs.python == 'true'
        run: |
          coverage report

      - name: Check Coverage Diff
        if: steps.filter.outputs.python == 'true' && github.event_name == 'pull_request'
        run: |
          diff-cover ./coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=100

  build:
    runs-on: ubuntu-latest
    name: Build Python Package

    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - '**.py'
              - 'pyproject.toml'

      - name: Set up Python
        uses: actions/setup-python@v7
        if: steps.filter.outputs.python == 'true'
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Install Tox
        if: steps.filter.outputs.python == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install tox

      # Guards the PEP 517 path that `pip install .` and `pip install git+...`
      # take. Needs no secrets, so it also runs for pull requests from forks.
      - name: Build and Check Distributions
        if: steps.filter.outputs.python == 'true'
        run: tox -e build

      - name: Verify Clean Install From Source
        if: steps.filter.outputs.python == 'true'
        run: |
          python -m venv /tmp/install-check
          /tmp/install-check/bin/pip install .
          /tmp/install-check/bin/qbt_migrate --version

      - name: Store Python Package as Artifact
        if: steps.filter.outputs.python == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      # Forks never match the repo check below. Dependabot pull requests do,
      # but GitHub does not pass repository secrets to them.
      - name: Build TestPyPI distributions
        id: testpypi
        if: |
          steps.filter.outputs.python == 'true'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          TESTPYPI_TOKEN: ${{ secrets.TESTPYPI_TOKEN }}
        run: |
          if [ -z "${TESTPYPI_TOKEN}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "TESTPYPI_TOKEN is not available for this pull request. Skipping TestPyPI upload."
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          python -m pip install --upgrade pip
          pip install build
          sed -i "s/^__version__ = \"\(.*\)\"$/__version__ = \"\1.dev${GITHUB_RUN_ID}\"/" qbt_migrate/__init__.py
          # The earlier build step already filled dist/ with the release version.
          rm -rf dist
          python -m build

      - name: Upload to TestPyPI
        if: steps.testpypi.outputs.available == 'true'
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          password: ${{ secrets.TESTPYPI_TOKEN }}
          # Token upload, not Trusted Publishing. Attestations need OIDC.
          attestations: false

# Builds the Docker image for every pull request, and additionally pushes it to
# GHCR for PRs labelled `pr-docker-build`.
name: Docker Build and Push - PRs

on:
  pull_request:
    types: [ opened, reopened, synchronize, labeled ]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Fork pull requests have no write token, so pushing is gated on the PR
      # coming from this repository. The build itself always runs, so a broken
      # Dockerfile is caught either way.
      - name: GitHub Container Registry Login
        if: |
          contains(github.event.pull_request.labels.*.name, 'pr-docker-build')
          && github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=pr

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ contains(github.event.pull_request.labels.*.name, 'pr-docker-build') && github.event.pull_request.head.repo.full_name == github.repository }}
          load: ${{ !contains(github.event.pull_request.labels.*.name, 'pr-docker-build') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Cheap smoke test so a PR cannot ship an image that fails to start.
      - name: Smoke Test
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'pr-docker-build') }}
        run: |
          mkdir -p /tmp/bt_backup
          docker run --rm --entrypoint qbt_migrate \
            "$(echo '${{ steps.meta.outputs.tags }}' | head -n1)" --version
          docker run --rm -v /tmp/bt_backup:/tmp/BT_backup \
            "$(echo '${{ steps.meta.outputs.tags }}' | head -n1)" \
            -e /old -n '/new path/with spaces' -t Linux

name: Package and Release
# Builds the distributions, publishes to PyPI via Trusted Publishing, and cuts
# a GitHub Release.
# Runs on semantic versioned tags only.

on:
  push:
    tags:
      - "*.*.*"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Distributions

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Check Tag Matches Package Version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(grep -oP '^__version__ = "\K[^"]+' qbt_migrate/__init__.py)"
          echo "tag=$TAG package=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match __version__ $VERSION"
            exit 1
          fi

      - name: Build and Check Distributions
        run: |
          python -m pip install --upgrade pip
          pip install tox
          tox -e build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    runs-on: ubuntu-latest
    name: Publish to PyPI
    needs:
      - build
    environment:
      name: pypi
      url: https://pypi.org/p/qbt_migrate
    permissions:
      # Required for Trusted Publishing. Replaces the long-lived PYPI_TOKEN
      # secret with a short-lived OIDC exchange.
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          attestations: true

  release:
    runs-on: ubuntu-latest
    name: Create GitHub Release
    needs:
      - pypi
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
